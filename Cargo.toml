[package]
name = "crossroads"
version = "0.1.0"
edition = "2024"
description = "Rule-based link router: open each link in the right browser"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
dirs = "7.0.0"
globset = { version = "0.4.21", default-features = false }
gpui-kit = "0.9.1"
image = { version = "0.25", default-features = false, features = ["png"] }
interprocess = "2.4.8"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8.23"
url = "2.5.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "UI",
    "UI_ViewManagement",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tiny-skia = "0.12.0"
